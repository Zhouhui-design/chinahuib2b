<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Chinahuib2b</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .offline-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: #1a202c;
      font-size: 28px;
      margin-bottom: 15px;
    }
    
    p {
      color: #718096;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .tips {
      background: #f7fafc;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }
    
    .tips h3 {
      color: #2d3748;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .tips ul {
      list-style: none;
      padding: 0;
    }
    
    .tips li {
      color: #4a5568;
      font-size: 14px;
      padding: 5px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .tips li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #48bb78;
      font-weight: bold;
    }
    
    .retry-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .retry-btn:hover {
      background: #1e40af;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #718096;
    }
    
    .status.online {
      color: #48bb78;
    }
    
    @media (max-width: 640px) {
      .offline-container {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .icon {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It seems you've lost your internet connection. Don't worry, you can still access some cached content.</p>
    
    <div class="tips">
      <h3>What you can do:</h3>
      <ul>
        <li>Check your network connection</li>
        <li>View previously visited pages</li>
        <li>Browse cached product listings</li>
        <li>Try again when back online</li>
      </ul>
    </div>
    
    <button class="retry-btn" onclick="location.reload()">
      🔄 Retry Connection
    </button>
    
    <div class="status" id="status">
      Checking connection...
    </div>
  </div>
  
  <script>
    // Check connection status
    function updateStatus() {
      const statusEl = document.getElementById('status');
      
      if (navigator.onLine) {
        statusEl.textContent = '✅ Connection restored! Reloading...';
        statusEl.className = 'status online';
        
        // Reload after 1 second
        setTimeout(() => {
          location.reload();
        }, 1000);
      } else {
        statusEl.textContent = '❌ Still offline. Please check your connection.';
        statusEl.className = 'status';
      }
    }
    
    // Listen for online/offline events
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    // Initial check
    updateStatus();
    
    // Register service worker if not already registered
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('SW registered:', registration);
        })
        .catch((error) => {
          console.log('SW registration failed:', error);
        });
    }
  </script>
</body>
</html>
